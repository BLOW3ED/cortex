      - "Da ejemplos concretos de entrada con su salida esperada, incluidos casos borde (archivo vacío, línea con campos de menos, páginas no numéricas o negativas)."
      - "Elige una representación clara para cada libro (diccionario o struct) y para el resultado (diccionario autor → páginas)."
      - "Propone funciones de una sola tarea con su contrato (por ejemplo: leer líneas, parsear una línea a registro o None, acumular por autor, imprimir reporte)."
      - "Valida en capas (forma, tipo y rango) y en un solo lugar, decidiendo qué pasa con las líneas inválidas."
      - "Menciona cómo probaría cada función por separado y luego el programa completo."
    respuesta_modelo: 'Ejemplos: con `Rayuela,Cortázar,1963,600` y `Ficciones,Borges,1944,200` espero `Cortázar: 600` y `Borges: 200`; con `Aura,Fuentes,1962` (faltan campos) y `Pedro Páramo,Rulfo,1955,muchas` (páginas no numéricas) espero que se reporten como inválidas; con un archivo vacío, un reporte vacío sin tronar. Datos: cada libro como diccionario `{"titulo", "autor", "anio", "paginas"}` y el resultado como diccionario autor → páginas. Funciones: `leer_lineas(ruta)` (lista de textos o error si no existe), `parsear(linea)` (registro o `None`; valida forma: 4 campos; tipo: `anio` y `paginas` enteros; rango: páginas mayores que 0 y año razonable), `acumular(registros)` (diccionario por autor), `procesar(lineas)` (totales y números de línea inválidos) e `imprimir_reporte(...)`. Probaría `parsear` con un `assert` por cada regla, `acumular` con listas pequeñas y luego `procesar` con una lista que mezcle líneas buenas, malas y vacías.'
    explicacion: 'Si tu diseño junta leer, validar y calcular en una sola función, o no dice qué regresa `parsear` cuando la línea es mala, vuelve a la sección "Las piezas y cómo se conectan".'

    conceptos: [diseno-programa, validacion-entradas, integracion-modulos]
    enunciado: 'Diseña (sin programarlo) un programa de "biblioteca personal" que lea un archivo con una línea por libro (`titulo,autor,anio,paginas`) y reporte cuántas páginas has leído por autor y qué líneas venían mal. Describe tus ejemplos de prueba, cómo representarías los datos, qué funciones harías (con lo que recibe y regresa cada una) y qué validarías.'

      #include <stdio.h>

      int mcd(int a, int b);
      int mcm(int a, int b);

      int main(void) {
          int a, b;
          scanf("%d %d", &a, &b);
          printf("%d %d\n", mcd(a, b), mcm(a, b));
          return 0;
      }

      int mcd(int a, int b) {
          /* algoritmo de Euclides */
          return 0;
      }

      int mcm(int a, int b) {
          /* usa mcd */
          return 0;
      }
    solucion: |
      #include <stdio.h>

      int mcd(int a, int b);
      int mcm(int a, int b);

      int main(void) {
          int a, b;
          scanf("%d %d", &a, &b);
          printf("%d %d\n", mcd(a, b), mcm(a, b));
          return 0;
      }

      int mcd(int a, int b) {
          while (b != 0) {
              int r = a % b;
              a = b;
              b = r;
          }
          return a;
      }

      int mcm(int a, int b) {
          return a / mcd(a, b) * b;
      }
    tests:
      - { entrada: "12 18\n", salida: "6 36\n" }
      - { entrada: "7 5\n", salida: "1 35\n" }
      - { entrada: "21 6\n", salida: "3 42\n" }
      - { entrada: "100 75\n", salida: "25 300\n", oculto: true }
      - { entrada: "9 9\n", salida: "9 9\n", oculto: true }
    pistas: ["Guarda `a % b` en una variable temporal antes de mover los valores.", "En `mcm`, divide antes de multiplicar para no desbordar el `int`."]
    explicacion: 'Euclides repite `(a, b) → (b, a % b)`: con 12 y 18 pasa por (18, 12), (12, 6), (6, 0) y da 6. Como `mcd` modifica sus parámetros, que son copias, `main` no pierde sus `a` y `b`. `mcm` reutiliza `mcd`: 12 / 6 · 18 = 36.'

  - id: prog-04-020
    tipo: codigo
    dificultad: 5
    conceptos: [descomposicion, prototipos-c]
    lenguaje: c
    enunciado: 'Dos números distintos son **amigos** si la suma de los divisores propios de cada uno (los divisores menores que él) es igual al otro. Lee un entero $n \ge 2$ e imprime, una pareja por línea y de menor a mayor, todas las parejas `a b` de amigos con $a < b \le n$. Si no hay ninguna, imprime `ninguno`. Escribe una función `suma_divisores(k)` y úsala.'
    plantilla: |
      #include <stdio.h>

      int suma_divisores(int k);

      int main(void) {
          int n;
          scanf("%d", &n);
          /* busca las parejas usando suma_divisores */
          return 0;
      }

      int suma_divisores(int k) {
          /* suma de los divisores de k menores que k */
          return 0;
      }
    solucion: |
      #include <stdio.h>

      int suma_divisores(int k);

      int main(void) {
          int n;
          int encontradas = 0;
          scanf("%d", &n);
          for (int a = 2; a <= n; a++) {
              int b = suma_divisores(a);
              if (b > a && b <= n && suma_divisores(b) == a) {
                  printf("%d %d\n", a, b);
                  encontradas++;
              }
          }
          if (encontradas == 0) {
              printf("ninguno\n");
          }
          return 0;
      }

      int suma_divisores(int k) {
          int suma = 0;
          for (int d = 1; d < k; d++) {
              if (k % d == 0) {
                  suma += d;
              }
          }
          return suma;
      }
    tests:
      - { entrada: "300\n", salida: "220 284\n" }
      - { entrada: "1500\n", salida: "220 284\n1184 1210\n" }
      - { entrada: "200\n", salida: "ninguno\n" }
      - { entrada: "3000\n", salida: "220 284\n1184 1210\n2620 2924\n", oculto: true }
      - { entrada: "284\n", salida: "220 284\n", oculto: true }
    pistas: ["Para cada a, calcula b = suma_divisores(a). Solo te interesa si b > a (así no repites ni cuentas los perfectos).", "Luego confirma el regreso: ¿suma_divisores(b) da a? Revisa también que b ≤ n."]
    explicacion: 'Con `suma_divisores` el problema principal queda corto: para cada a se calcula su "candidato" b y se confirma que el camino de regreso lleve a a. Pedir b > a evita imprimir dos veces la misma pareja y descarta los números perfectos (como 6, cuya suma da él mismo). La pareja (220, 284) aparece justo cuando n llega a 284.'

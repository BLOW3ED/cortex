  - id: prog-09-018
    tipo: predecir_salida
    dificultad: 4
    conceptos: [recursion-vs-iteracion, pila-de-llamadas]
    lenguaje: python
    enunciado: '¿Qué imprime este programa? Son dos números en una línea.'
    codigo: |
      llamadas = 0

      def fib(n):
          global llamadas
          llamadas += 1
          if n < 2:
              return n
          return fib(n - 1) + fib(n - 2)

      print(fib(5), llamadas)
    respuesta: "5 15"
    pistas: ["Cuenta las llamadas de abajo hacia arriba: `fib(0)` y `fib(1)` hacen 1 llamada cada una; `fib(2)` hace 1 más las de `fib(1)` y `fib(0)`.", "Las llamadas de `fib(n)` son 1 + las de `fib(n - 1)` + las de `fib(n - 2)`."]
    explicacion: '`fib(5)` vale 5. Si $L(n)$ es el número de llamadas, $L(0) = L(1) = 1$ y $L(n) = 1 + L(n-1) + L(n-2)$: $L(2) = 3$, $L(3) = 5$, $L(4) = 9$ y $L(5) = 15$. Por ejemplo, `fib(2)` se calcula 3 veces y `fib(1)`, 5. Ese trabajo repetido crece casi tan rápido como los propios números de Fibonacci.'

  - id: prog-09-019
    tipo: codigo
    dificultad: 4
    conceptos: [divide-y-venceras, recursion-en-secuencias]
    lenguaje: python
    enunciado: |
      Escribe `ordenar_mezcla(xs)` que regrese una lista **nueva** con los elementos de `xs` ordenados de menor a mayor, usando divide y vencerás (ordenamiento por mezcla). No uses `sort` ni `sorted`.

      1. Si la lista tiene 0 o 1 elementos, ya está ordenada.
      2. Si no, pártela a la mitad y ordena cada mitad con una llamada recursiva.
      3. Mezcla las dos mitades ordenadas: compara el primer elemento pendiente de cada una, toma el menor y repite; cuando una se acabe, agrega lo que quede de la otra.
    plantilla: |
      def ordenar_mezcla(xs):
          pass
    solucion: |
      def mezclar(a, b):
          res = []
          i = j = 0
          while i < len(a) and j < len(b):
              if a[i] <= b[j]:
                  res.append(a[i])
                  i += 1
              else:
                  res.append(b[j])
                  j += 1
          return res + a[i:] + b[j:]

      def ordenar_mezcla(xs):
          if len(xs) <= 1:
              return list(xs)
          medio = len(xs) // 2
          return mezclar(ordenar_mezcla(xs[:medio]), ordenar_mezcla(xs[medio:]))
    tests:
      - { expr: "ordenar_mezcla([5, 2, 9, 1, 5, 6])", esperado: [1, 2, 5, 5, 6, 9] }
      - { expr: "ordenar_mezcla([])", esperado: [] }
      - { expr: "ordenar_mezcla([3, -1])", esperado: [-1, 3], oculto: true }
      - { expr: "ordenar_mezcla(list(range(500, 0, -1))) == list(range(1, 501))", esperado: true, oculto: true }
      - { expr: "(lambda xs: (ordenar_mezcla(xs), xs)[1])([3, 1, 2])", esperado: [3, 1, 2], oculto: true }
    pistas: ["Escribe primero una función auxiliar `mezclar(a, b)` que una dos listas ya ordenadas.", "Para partir: `xs[:medio]` y `xs[medio:]` con `medio = len(xs) // 2`.", "En `mezclar`, usa dos índices, uno por lista; al final agrega `a[i:]` y `b[j:]`."]
    explicacion: 'Es el esquema completo de divide y vencerás: dividir a la mitad, resolver cada mitad recursivamente y combinar con la mezcla, que recorre las dos listas una sola vez. Las rebanadas crean listas nuevas, así que la original no cambia (lo revisa una prueba oculta). La profundidad de la recursión es de solo unos $\log_2 n$ niveles: con 500 elementos, unos 9.'

  - id: prog-09-020
    tipo: codigo
    dificultad: 5
    conceptos: [divide-y-venceras, recursion-vs-iteracion]
    lenguaje: python
    enunciado: |
      Escribe `potencia_mod(b, e, m)`, recursiva, que regrese $b^e \bmod m$ (con $e \ge 0$ y $m \ge 1$) usando divide y vencerás:

      - $b^0 = 1$.
      - Si $e$ es par, $b^e = \left(b^{e/2}\right)^2$.
      - Si $e$ es impar, $b^e = b \cdot b^{e-1}$.

      Aplica `% m` en cada paso para que los números no crezcan. Debe funcionar con exponentes enormes, como $10^{18}$, donde multiplicar $e$ veces nunca terminaría. No uses `pow` ni `**`.
    plantilla: |
      def potencia_mod(b, e, m):
          pass
    solucion: |
      def potencia_mod(b, e, m):
          if e == 0:
              return 1 % m
          if e % 2 == 0:
              mitad = potencia_mod(b, e // 2, m)
              return mitad * mitad % m
          return b * potencia_mod(b, e - 1, m) % m
    tests:
      - { expr: "potencia_mod(2, 10, 1000)", esperado: 24 }
      - { expr: "potencia_mod(3, 0, 7)", esperado: 1 }
      - { expr: "potencia_mod(7, 13, 100)", esperado: 7 }
      - { expr: "potencia_mod(5, 3, 1)", esperado: 0, oculto: true }
      - { expr: "potencia_mod(7, 10**18, 1000000007)", esperado: 259616729, oculto: true }
      - { expr: "potencia_mod(123456789, 10**18 + 1, 998244353)", esperado: 682641697, oculto: true }
    pistas: ["Si $e$ es par, calcula `mitad = potencia_mod(b, e // 2, m)` **una sola vez** y regresa `mitad * mitad % m`.", "Llamar dos veces a `potencia_mod(b, e // 2, m)` da el resultado correcto, pero vuelve a hacer $e$ multiplicaciones.", "¿Qué debe regresar el caso base si `m` es 1?"]
    explicacion: 'Con exponente par se resuelve **un** subproblema de la mitad de tamaño y se eleva al cuadrado; con impar se baja a par en un paso. Así el exponente se reduce a la mitad al menos cada dos llamadas: para $10^{18}$ bastan unas 120 llamadas en lugar de $10^{18}$ multiplicaciones. Si en el caso par llamas dos veces a la mitad, cada nivel duplica el trabajo y vuelves a $e$ multiplicaciones. Como todo se reduce módulo `m`, con `m = 1` el resultado siempre es 0.'

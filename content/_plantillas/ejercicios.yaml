# Plantilla de ejercicios. Copia el bloque que necesites. Ver docs/05-formato-contenido.md.
# Usa comillas simples para enunciados con LaTeX (así no hay que duplicar las barras invertidas).
unidad: materia/NN-nombre-unidad
ejercicios:
  # --- numerico ---
  - id: pref-NN-001
    tipo: numerico
    dificultad: 1
    conceptos: [concepto-uno]
    enunciado: 'Calcula $...$.'
    respuesta: 0
    tolerancia: 0
    verificar: { sympy: "expresion_de_sympy" }   # o { python: "..." } o { revision: "manual" }
    pistas: ["Pista 1"]
    explicacion: 'Explicación paso a paso.'

  # --- simbolico ---
  - id: pref-NN-002
    tipo: simbolico
    dificultad: 2
    conceptos: [concepto-uno]
    enunciado: 'Simplifica ...'
    respuesta: "x+3"
    verificar: { sympy: "expresion_equivalente" }
    explicacion: '...'

  # --- opcion_multiple (valores es opcional y verificable) ---
  - id: pref-NN-003
    tipo: opcion_multiple
    dificultad: 2
    conceptos: [concepto-uno]
    enunciado: '...'
    opciones: ["A", "B", "C", "D"]
    valores: [1, 2, 3, 4]
    correcta: 1
    verificar: { sympy: "expresion" }
    explicacion: '...'

  # --- completar ---
  - id: pref-NN-004
    tipo: completar
    dificultad: 2
    conceptos: [concepto-uno]
    enunciado: 'Completa.'
    texto: 'Un ___ y un ___.'
    respuestas: ["uno", "otro"]
    explicacion: '...'

  # --- ordenar ---
  - id: pref-NN-005
    tipo: ordenar
    dificultad: 2
    conceptos: [concepto-uno]
    enunciado: 'Ordena los pasos.'
    elementos: ["Paso 1", "Paso 2", "Paso 3"]
    explicacion: '...'

  # --- codigo (python) ---
  - id: pref-NN-006
    tipo: codigo
    dificultad: 2
    conceptos: [concepto-uno]
    lenguaje: python
    enunciado: 'Escribe `f(x)` que ...'
    plantilla: |
      def f(x):
          pass
    solucion: |
      def f(x):
          return x
    tests:
      - { expr: "f(2)", esperado: 2, tolerancia: 0 }
    explicacion: '...'

  # --- codigo (c) ---
  - id: pref-NN-007
    tipo: codigo
    dificultad: 3
    conceptos: [concepto-uno]
    lenguaje: c
    enunciado: 'Escribe un programa en C que ...'
    plantilla: |
      #include <stdio.h>
      int main(void) {
          return 0;
      }
    solucion: |
      #include <stdio.h>
      int main(void) {
          printf("hola\n");
          return 0;
      }
    tests:
      - { entrada: "", salida: "hola\n" }
    explicacion: '...'

  # --- predecir_salida ---
  - id: pref-NN-008
    tipo: predecir_salida
    dificultad: 2
    conceptos: [concepto-uno]
    lenguaje: python
    enunciado: '¿Qué imprime?'
    codigo: |
      print(1 + 1)
    respuesta: "2"
    explicacion: '...'

  # --- autoevaluacion ---
  - id: pref-NN-009
    tipo: autoevaluacion
    dificultad: 3
    conceptos: [concepto-uno]
    enunciado: 'Explica con tus palabras ...'
    rubrica: ["Criterio 1", "Criterio 2", "Criterio 3"]
    respuesta_modelo: '...'
    explicacion: '...'
    tarjeta: false

  # --- depurar (Debug Dojo, Fase 2): `codigo` trae el error; `solucion` solo cambia las líneas de `linea_bug` ---
  - id: pref-NN-010
    tipo: depurar
    dificultad: 2
    conceptos: [concepto-uno]
    lenguaje: python                 # o c (con tests { entrada, salida })
    enunciado: '`mayor(a, b)` debería regresar el mayor de los dos, pero falla. Encuentra la línea con el error y corrígela.'
    codigo: |
      def mayor(a, b):
          if a < b:
              return a
          return b
    linea_bug: 2                     # o [2, 3]
    solucion: |
      def mayor(a, b):
          if a > b:
              return a
          return b
    tests:
      - { expr: "mayor(3, 5)", esperado: 5 }
      - { expr: "mayor(9, 1)", esperado: 9, oculto: true }   # oculto: la app no muestra la prueba
    explicacion: '...'

  # --- parsons (Fase 2): `lineas` en el orden correcto; en Python con su sangría (4 espacios) ---
  - id: pref-NN-011
    tipo: parsons
    dificultad: 2
    conceptos: [concepto-uno]
    lenguaje: python
    enunciado: 'Ordena las líneas para que `signo(x)` regrese 1 si x es positivo y 0 si no.'
    lineas:
      - "def signo(x):"
      - "    if x > 0:"
      - "        return 1"
      - "    return 0"
    distractores: ["    return -1"]   # opcional: líneas que sobran
    tests:                             # opcional: el programa armado debe pasarlos
      - { expr: "signo(4)", esperado: 1 }
      - { expr: "signo(-4)", esperado: 0 }
    explicacion: '...'

  # --- rastreo_memoria (Fase 2, solo C): pila y heap paso a paso; las preguntas se verifican con printf ---
  - id: pref-NN-012
    tipo: rastreo_memoria
    dificultad: 4
    conceptos: [concepto-uno]
    lenguaje: c
    enunciado: 'Sigue el programa línea por línea y contesta lo que se pregunta.'
    codigo: |
      #include <stdio.h>
      #include <stdlib.h>
      int main(void) {
          int a = 5;
          int *p = &a;
          *p = 8;
          int *q = malloc(sizeof(int));
          *q = a + 1;
          printf("%d %d\n", a, *q);
          free(q);
          return 0;
      }
    pasos:
      - linea: 4                      # línea que se acaba de ejecutar
        pila: [{ nombre: "a", valor: "5", expr: "a", formato: "%d" }]
      - linea: 5
        nota: '`p` guarda la dirección de `a`: la flecha indica a quién apunta.'
        pila: [{ nombre: "a", valor: "5" }, { nombre: "p", valor: "→ a" }]
        pregunta: '¿Cuánto vale `*p`?'
        respuesta: "5"
        expr: "*p"                    # expresión C que se imprime con `formato` tras la línea
        formato: "%d"
      - linea: 8
        pila: [{ nombre: "a", valor: "8" }, { nombre: "p", valor: "→ a" }, { nombre: "q", valor: "→ bloque" }]
        heap: [{ nombre: "bloque", valor: "9", expr: "*q", formato: "%d" }]
        pregunta: '¿Qué valor hay en el bloque del heap?'
        respuesta: "9"
        expr: "*q"
        formato: "%d"
    explicacion: '...'
